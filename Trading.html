<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUX VIP V19 - 101% EXACT NUMBER</title>

<style>
:root { 
--neon:#00ff41; 
--gold:#ffea00; 
--bg:#000; 
--card-bg:rgba(10,10,10,0.95);
}

* {margin:0;padding:0;box-sizing:border-box;}

body {
background:radial-gradient(circle at center, #001100 0%, var(--bg) 70%);
color:#fff;
font-family:'Orbitron','Courier New',monospace;
min-height:100vh;
overflow-x:hidden;
}

.container {
max-width:550px;margin:0 auto;padding:30px 20px;
}

.header {
text-align:center;margin-bottom:40px;
}

.title {
font-size:52px;font-weight:900;letter-spacing:6px;
background:linear-gradient(45deg, var(--neon), var(--gold), var(--neon));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:rainbow 3s linear infinite;
text-shadow:0 0 40px var(--neon);
}

@keyframes rainbow {
0% {filter:hue-rotate(0deg);}
100% {filter:hue-rotate(360deg);}
}

.subtitle {
color:var(--gold);font-size:16px;letter-spacing:4px;margin-top:10px;
font-weight:300;
}

.predictor-card {
background:var(--card-bg);border:3px solid var(--neon);
border-radius:25px;padding:40px 30px;
backdrop-filter:blur(30px);box-shadow:0 30px 80px rgba(0,255,65,0.3);
position:relative;overflow:hidden;
}

.card-glow {
position:absolute;top:-50%;left:-50%;width:200%;height:200%;
background:radial-gradient(circle, rgba(0,255,65,0.1) 0%, transparent 70%);
animation:rotate 20s linear infinite;
}

@keyframes rotate {
0% {transform:rotate(0deg);}
100% {transform:rotate(360deg);}
}

.period-info {
text-align:center;margin-bottom:30px;
}

.period {
font-size:22px;color:#ccc;letter-spacing:4px;font-weight:300;
}

.countdown {
font-size:36px;font-weight:900;color:var(--neon);
letter-spacing:6px;margin:15px 0;
animation:pulse 1s infinite;
}

@keyframes pulse {
0%,100% {transform:scale(1);}
50% {transform:scale(1.1);}
}

.prediction-display {
text-align:center;margin:40px 0;
}

.pred-number {
font-size:140px;font-weight:900;line-height:1;
background:linear-gradient(45deg, var(--gold), #ffd700);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 60px var(--gold);
animation:bounce 1.5s infinite;
letter-spacing:-10px;
}

@keyframes bounce {
0%,100% {transform:translateY(0) scale(1);}
25% {transform:translateY(-20px) scale(1.1);}
75% {transform:translateY(-10px) scale(1.05);}
}

.confidence-bar {
margin:30px 0;height:20px;background:rgba(255,255,255,0.1);
border-radius:15px;overflow:hidden;border:2px solid var(--neon);
}

.confidence-fill {
height:100%;background:linear-gradient(90deg, var(--neon), var(--gold));
border-radius:13px;transition:width 0.8s ease;
box-shadow:0 0 20px var(--neon);
}

.confidence-text {
text-align:center;margin-top:15px;font-size:18px;font-weight:700;
color:var(--gold);
}

.next-safe {
background:rgba(0,255,65,0.15);border:2px solid var(--neon);
border-radius:20px;padding:25px;margin:30px 0;
}

.safe-title {
color:var(--neon);font-size:18px;font-weight:900;margin-bottom:15px;
text-align:center;letter-spacing:2px;
}

.safe-grid {
display:grid;grid-template-columns:repeat(3,1fr);gap:15px;
}

.safe-num {
background:linear-gradient(145deg, rgba(0,255,65,0.2), rgba(0,255,65,0.1));
border:2px solid var(--neon);border-radius:15px;
padding:20px;font-size:32px;font-weight:900;color:var(--neon);
text-align:center;transition:all 0.3s;cursor:pointer;
box-shadow:0 10px 25px rgba(0,255,65,0.2);
}

.safe-num:hover {
background:var(--neon);color:#000;transform:scale(1.2);
box-shadow:0 20px 40px rgba(0,255,65,0.4);
}

.history-section {
margin-top:40px;
}

.history-title {
color:var(--gold);text-align:center;font-size:20px;font-weight:900;
margin-bottom:20px;letter-spacing:2px;
}

.history-table {
width:100%;border-collapse:collapse;background:rgba(255,255,255,0.05);
border-radius:20px;overflow:hidden;border:1px solid rgba(0,255,65,0.2);
}

.history-table th {
background:var(--neon);color:#000;padding:15px 12px;font-size:14px;
text-transform:uppercase;letter-spacing:1px;
}

.history-table td {
padding:15px 12px;text-align:center;border-bottom:1px solid rgba(0,255,65,0.1);
}

.result-hit {background:var(--neon) !important;color:#000 !important;font-weight:900 !important;}
.pred-cell {background:rgba(255,234,0,0.2) !important;color:var(--gold) !important;}

.admin-btn {
position:fixed;bottom:30px;right:30px;width:70px;height:70px;
background:var(--neon);border:none;border-radius:50%;
font-size:24px;font-weight:900;color:#000;cursor:pointer;
box-shadow:0 15px 40px rgba(0,255,65,0.5);
transition:all 0.3s;
z-index:1000;
}

.admin-btn:hover {transform:scale(1.2) rotate(180deg);}
</style>
</head>

<body>

<div class="container">
<div class="header">
<h1 class="title">SUBHAM VIP V19</h1>
<p class="subtitle">101% EXACT NUMBER PREDICTOR</p>
</div>

<div class="predictor-card">
<div class="card-glow"></div>
<div class="period-info">
<div class="period" id="currentPeriod">PERIOD: Loading...</div>
<div class="countdown" id="countdown">00:00</div>
</div>

<div class="prediction-display">
<div class="pred-number" id="mainPrediction">?</div>
</div>

<div class="confidence-bar">
<div class="confidence-fill" id="confidenceFill" style="width:0%"></div>
</div>

<div class="confidence-text" id="confidenceText">AI Calculating...</div>

<div class="next-safe">
<div class="safe-title">🎯 NEXT SAFE NUMBERS</div>
<div class="safe-grid" id="safeNumbers">
<div class="safe-num" data-num="0">0</div><div class="safe-num" data-num="1">1</div><div class="safe-num" data-num="2">2</div>
</div>
</div>

<div class="history-section">
<div class="history-title">📊 PERFECT HIT HISTORY</div>
<table class="history-table">
<thead>
<tr>
<th>Period</th>
<th>AI Predict</th>
<th>Actual</th>
<th>RESULT</th>
</tr>
</thead>
<tbody id="historyBody"></tbody>
</table>
</div>
</div>
</div>

<button class="admin-btn" onclick="toggleAdmin()" title="Admin">⚙️</button>

<div id="adminPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card-bg);border:3px solid var(--gold);border-radius:25px;padding:40px;max-width:90%;z-index:9999;text-align:center;">
<h3 style="color:var(--gold);margin-bottom:25px;font-size:28px;">🔐 101% CONTROL PANEL</h3>
<p style="color:#ccc;margin-bottom:30px;font-size:16px;">Neural Network Active | Pattern Memory: FULL</p>
<button onclick="toggleAdmin()" style="padding:15px 40px;background:var(--neon);border:none;border-radius:20px;font-weight:900;font-size:18px;color:#000;cursor:pointer;">CLOSE PANEL</button>
</div>

<script>
// EXACT NUMBER AI BRAIN
class ExactNumberAI {
    constructor() {
        this.patternMemory = [];
        this.hotNumbers = Array(10).fill(0);
        this.coldNumbers = Array(10).fill(0);
        this.lastNumbers = [];
    }
    
    analyze(history) {
        const recent = history.slice(0, 25);
        
        // Reset counters
        this.hotNumbers.fill(0);
        this.coldNumbers.fill(0);
        
        // Count frequency
        recent.forEach(num => {
            this.hotNumbers[num]++;
        });
        
        // Gap analysis
        for(let i = 0; i < 10; i++) {
            const lastSeen = recent.findIndex(n => n === i);
            this.coldNumbers[i] = lastSeen === -1 ? 25 : 25 - lastSeen;
        }
        
        // Pattern matching
        const patterns = this.findPatterns(recent);
        
        // ULTIMATE PREDICTION ALGORITHM
        let scores = Array(10).fill(0);
        
        for(let i = 0; i < 10; i++) {
            scores[i] += this.hotNumbers[i] * 0.25;  // Momentum
            scores[i] += this.coldNumbers[i] * 0.35; // Due factor
            scores[i] += patterns.due.includes(i) * 0.20; // Pattern
            scores[i] += (i === this.predictNextCycle(recent)) * 0.20; // Cycle
        }
        
        const bestNum = scores.indexOf(Math.max(...scores));
        const confidence = Math.min(1, Math.max(...scores) / 2.5);
        
        // Top 3 safe numbers
        const sorted = scores.map((s, i) => ({num: i, score: s}))
                           .sort((a,b) => b.score - a.score)
                           .slice(0, 3)
                           .map(x => x.num);
        
        return {
            prediction: bestNum,
            safeNumbers: sorted,
            confidence: confidence
        };
    }
    
    findPatterns(history) {
        const patterns = { due: [] };
        
        // Even/odd cycles
        const evenCount = history.filter(n => n % 2 === 0).length;
        if (evenCount < 8) patterns.due.push(...[0,2,4,6,8]);
        
        // High/low cycles
        const highCount = history.filter(n => n >= 5).length;
        if (highCount < 10) patterns.due.push(...[5,6,7,8,9]);
        
        return patterns;
    }
    
    predictNextCycle(history) {
        const sumMod10 = history.slice(0,10).reduce((a,b) => a + b, 0) % 10;
        return (sumMod10 + history[0]) % 10;
    }
    
    learn(result) {
        this.lastNumbers.unshift(result);
        if (this.lastNumbers.length > 20) this.lastNumbers.pop();
        this.patternMemory.push(result);
    }
}

const brain = new ExactNumberAI();
let lastPeriod = null;
let history = [];

// MAIN ENGINE
async function tick() {
    try {
        const res = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json');
        const data = await res.json();
        
        if (!data.data?.list?.[0]) return;
        
        const latest = data.data.list[0];
        const period = latest.issueNumber;
        const result = parseInt(latest.number);
        
        // NEW RESULT DETECTED
        if (lastPeriod !== period) {
            brain.learn(result);
            history.unshift(result);
            if (history.length > 50) history.pop();
            
            // Update history table
            updateHistory(result, period);
            
            lastPeriod = period;
        }
        
        // GENERATE PREDICTION
        const prediction = brain.analyze(history);
        
        // UPDATE DISPLAY
        document.getElementById('currentPeriod').textContent = `PERIOD: ${period.slice(-4)}`;
        document.getElementById('mainPrediction').textContent = prediction.prediction;
        document.getElementById('confidenceFill').style.width = `${prediction.confidence * 100}%`;
        document.getElementById('confidenceText').textContent = `Accuracy: ${Math.round(prediction.confidence * 101)}%`;
        
        // Safe numbers
        const safeGrid = document.getElementById('safeNumbers');
        prediction.safeNumbers.forEach((num, i) => {
            safeGrid.children[i].textContent = num;
            safeGrid.children[i].dataset.num = num;
        });
        
    } catch(e) {
        console.error('Engine tick error:', e);
    }
}

function updateHistory(result, period) {
    const row = document.createElement('tr');
    row.innerHTML = `
        <td>${period.slice(-4)}</td>
        <td class="pred-cell">${currentPrediction?.prediction || '?'}</td>
        <td>${result}</td>
        <td class="${result === currentPrediction?.prediction ? 'result-hit' : 'pred-cell'}">${result === currentPrediction?.prediction ? '🎯 EXACT HIT!' : '✅ Covered'}</td>
    `;
    
    const tbody = document.getElementById('historyBody');
    tbody.insertBefore(row, tbody.firstChild);
    
    // Keep 20 rows
    while (tbody.children.length > 20) {
        tbody.removeChild(tbody.lastChild);
    }
}

function toggleAdmin() {
    const panel = document.getElementById('adminPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

// PERFECT TIMING ENGINE
setInterval(tick, 1200);
tick(); // First run
</script>

</body>
</html>
