<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUX VIP SUPREME V16</title>

<style>
:root { --neon:#00ff41; --danger:#ff003c; --gold:#ffea00; --bg:#050505; }

body{
background:var(--bg);
color:#fff;
font-family:'Segoe UI',sans-serif;
margin:0;
}

.header-container{
text-align:center;
padding:30px 10px;
}

.zigzag-name{
font-size:38px;
font-weight:900;
letter-spacing:5px;
text-shadow:2px 2px var(--danger),-2px -2px var(--neon),0 0 20px var(--neon);
}

.glass-box{
max-width:400px;
margin:auto;
background:rgba(255,255,255,0.03);
border:1px solid rgba(0,255,65,0.2);
border-radius:25px;
padding:25px;
text-align:center;
}

.pred-val{
font-size:55px;
font-weight:900;
text-shadow:0 0 20px var(--neon);
}

.win{color:var(--neon);}
.loss{color:var(--danger);}
</style>
</head>

<body>

<div class="header-container">
<div class="zigzag-name">SUBHAM VIP</div>
</div>

<div class="glass-box">
<div id="pID">PERIOD: ---</div>
<div class="pred-val" id="pRes">WAIT...</div>
<div id="pOpps">ANALYZING...</div>

<table width="100%" id="logs"></table>
</div>

<script>

// 🔥 SMART LOGIC
function getSmartPrediction(data){

  const last20 = data.slice(0,20);

  let freq = Array(10).fill(0);
  let weight = 20;

  last20.forEach(x=>{
    const num = parseInt(x.number);
    freq[num] += weight;
    weight--;
  });

  let bias = 0;
  last20.slice(0,5).forEach(x=>{
    const n = parseInt(x.number);
    if(n>=5) bias++; else bias--;
  });

  for(let i=0;i<10;i++){
    if(bias>0 && i>=5) freq[i]+=5;
    if(bias<0 && i<5) freq[i]+=5;
  }

  const sorted = freq
    .map((v,i)=>({num:i,score:v}))
    .sort((a,b)=>b.score-a.score);

  return {
    main: sorted[0].num,
    alt: sorted[1].num,
    type: sorted[0].num>=5?"BIG":"SMALL"
  };
}

let lastId=null;
let savedPrediction=null;
let savedNums=[];
let total=0,wins=0;

async function run(){

  try{
    const res=await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json');
    const json=await res.json();
    const latest=json.data.list[0];

    const smart=getSmartPrediction(json.data.list);

    if(lastId!==latest.issueNumber){

      if(lastId){
        const actual=parseInt(latest.number);

        total++;

        const isWin = savedNums.includes(actual);
        if(isWin) wins++;

        document.getElementById('logs').innerHTML =
        `<tr>
        <td>${latest.issueNumber.slice(-3)}</td>
        <td>${savedNums.join(",")}</td>
        <td>${actual}</td>
        <td class="${isWin?'win':'loss'}">${isWin?'WIN':'LOSS'}</td>
        </tr>` + document.getElementById('logs').innerHTML;

        console.log("Accuracy:",(wins/total*100).toFixed(2)+"%");
      }

      lastId=latest.issueNumber;
      savedPrediction=smart.type;
      savedNums=[smart.main,smart.alt];
    }

    document.getElementById('pID').innerText="PERIOD: "+(BigInt(latest.issueNumber)+1n);
    document.getElementById('pRes').innerText=smart.type;
    document.getElementById('pOpps').innerText="NUMS: "+savedNums.join(", ");

  }catch(e){}

}

// 🔁 LOOP
setInterval(run,3000);

</script>

</body>
</html>
